version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: automaton_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: automaton_db
    ports:
      - "27017:27017"
    volumes:
      - ../data/db:/data/db

  mongo-express:
    image: mongo-express
    container_name: automaton_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongodb
