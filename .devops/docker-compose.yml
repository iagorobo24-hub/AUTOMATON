# AUTOMATON development backend
# Usage: docker compose -f .devops/docker-compose.yml up --build

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: automaton_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - automaton_sqlite:/data
    working_dir: /data
    command: ["uvicorn", "app.main:app", "--app-dir", "/app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  automaton_sqlite:
